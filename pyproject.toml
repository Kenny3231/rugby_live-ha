[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
# Home Assistant 2026.10 requires Python 3.14.
target-version = "py314"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "SIM", "RUF"]
# RUF001: French typography (en dash); RUF012: Home Assistant _attr_* class attributes.
ignore = ["RUF001", "RUF012"]
