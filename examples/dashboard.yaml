              if (mem[k] !== v) mem['p' + k] = true;
              mem[k] = v;
              if (mem['p' + k] && !animOn) { bump[k] = ' rl-bump'; mem['p' + k] = false; }
            }
            const sbLogo = (url, name, color) => url ? `<img src="${url}">`
              : `<div class="rl-init" style="background:${color || '#334155'}">${(name || '?').slice(0, 3).toUpperCase()}</div>`;
            main = `<div class="rl-comp">${COMP[sa.competition] || ''}</div>
              <div class="rl-sb" style="--hc:${a.home_color || '#334155'};--ac:${a.away_color || '#334155'}">
                <div class="rl-sbt rl-sbh">${sbLogo(a.home_logo, a.home_name, a.home_color)}<span>${a.home_name || ''}</span></div>
                <div class="rl-sbs rl-sbsh${prov}${bump.h || ''}">${hs}</div>
                <div class="rl-clock">${clock}</div>
                <div class="rl-sbs rl-sbsa${prov}${bump.a || ''}">${as}</div>
                <div class="rl-sbt rl-sba"><span>${a.away_name || ''}</span>${sbLogo(a.away_logo, a.away_name, a.away_color)}</div>
                <div class="rl-sbd rl-sbdh"><div>${brk(cnt.home)}</div>${bonus(hs, as, tries(cnt.home), tries(cnt.away))}</div>
                <div class="rl-sbd rl-sbda"><div>${brk(cnt.away)}</div>${bonus(as, hs, tries(cnt.away), tries(cnt.home))}</div>
              </div>
              ${provtag}${last}${chan}${next}`;
          }
        }

        let overlay = '';
        const an = states['sensor.match_suivi_animation'];
        const t = an ? an.state : 'idle';
        const aa = an ? an.attributes : {};
        const durMs = (aa.duration || 20) * 1000;
        const age = aa.started_at ? Date.now() - Date.parse(aa.started_at) : NaN;
        if (t !== 'idle' && !isNaN(age) && age >= 0 && age < durMs) {
          const TXT = {try: 'ESSAI !', conversion: 'TRANSFORMATION', penalty_goal: 'PÉNALITÉ', drop_goal: 'DROP !',
            yellow_card: 'CARTON JAUNE', red_card: 'CARTON ROUGE', kickoff: "COUP D'ENVOI", half_time: 'MI-TEMPS',
            second_half: 'REPRISE', extra_time: 'PROLONGATIONS', full_time: 'FIN DU MATCH', revoked: 'ACTION ANNULÉE'};
          const KIND = {try: 'Essai', conversion: 'Transformation', penalty_goal: 'Pénalité', drop_goal: 'Drop',
            yellow_card: 'Carton jaune', red_card: 'Carton rouge'};
          // Same markup as tools/animation_preview.html (test page): keep both in sync.
          const tid = aa.team_id;
          const home = tid && tid === a.home_id;
          const card = t === 'yellow_card' || t === 'red_card';
          const scoring = ['try', 'conversion', 'penalty_goal', 'drop_goal'].includes(t);
          const info = !card && !scoring;  // kickoff, half time, full time, cancelled event: text only
          const tcolor = home ? a.home_color : (tid ? a.away_color : null);
          const tlogo = home ? a.home_logo : (tid ? a.away_logo : null);
          const color = t === 'yellow_card' ? '#eab308' : t === 'red_card' ? '#dc2626' : (!info && tcolor) || '#334155';
          const fg = t === 'yellow_card' ? '#111' : '#fff';
          const special = tid === '25922' && scoring;
          const media = `/local/rugby_live/anim/${special ? t + '_toulouse' : t}.mp4#t=${(age / 1000 % 6).toFixed(1)}`;
          const label = TXT[t] || t;
          const min = aa.minute ? aa.minute + "'" : '';
          const sec = age / 1000;
          // Background layers picked in the integration options (cards: whistle scene). Offsets
          // add to the age and confetti positions are index-based (no Math.random), so each
          // re-render of this card keeps everything in place.
          const bg = aa.background || [];
          const rings = [0, 0.8, 1.6].map((o) => `<div class="rl-ring" style="animation-delay:-${(sec + o).toFixed(2)}s"></div>`).join('');
          const cols = [color, '#ffffff', '#fbbf24'];
          const confetti = card || !bg.includes('confetti') ? '' : Array.from({length: 36}, (_, i) =>
            `<i class="rl-cf" style="left:${(i * 37) % 100}%;width:${(0.6 + (i % 3) * 0.3).toFixed(1)}vw;background:${cols[i % 3]};`
            + `animation-duration:${(3 + (i % 5) * 0.6).toFixed(1)}s;animation-delay:-${(sec + i * 0.53).toFixed(2)}s"></i>`).join('');
          const back = card ? `<div class="rl-strobe"></div>${rings}`
            : (bg.includes('rays') ? `<div class="rl-burst" style="animation-duration:${durMs}ms"></div><div class="rl-rays2"></div>` : '')
              + (bg.includes('beams') ? '<div class="rl-beam rl-l"></div><div class="rl-beam rl-r"></div>' : '')
              + (bg.includes('rings') ? rings : '');
          const WHISTLE = `<svg class="rl-whistle" viewBox="0 0 180 100" aria-hidden="true">
            <circle cx="16" cy="34" r="9" fill="none" stroke="#cbd5e1" stroke-width="4"/>
            <rect x="46" y="26" width="92" height="24" rx="6" fill="#e2e8f0"/>
            <circle cx="50" cy="60" r="32" fill="#e2e8f0"/><circle cx="50" cy="60" r="11" fill="#475569"/>
            <rect x="96" y="30" width="16" height="7" rx="2" fill="#475569"/>
            <g fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
              <path class="rl-wave" d="M148 26 q8 12 0 24"/>
              <path class="rl-wave" style="animation-delay:.12s" d="M158 18 q14 20 0 40"/>
              <path class="rl-wave" style="animation-delay:.24s" d="M168 10 q20 28 0 56"/></g></svg>`;
          // Foreground: player photo (LNR) + card / name band, else logo (or card) + title + line.
          const photo = !info && aa.player_photo;
          const logo = tlogo && !info ? `<img class="rl-ovlogo" src="${tlogo}">` : '';
          const cardEl = card ? '<div class="rl-card"></div>' : '';
          const title = `<div class="rl-ovtxt" style="--n:${label.length}">${label}</div>`;
          const line = [t === 'revoked' && KIND[aa.revoked_type], aa.player || aa.team_name, min].filter(Boolean).join(' • ');
          const front = photo
            ? `<div class="rl-phw"><img class="rl-ph" src="${photo}" onerror="this.parentNode.remove()">${cardEl}</div>
               <div class="rl-col">${logo}${title}
                 <div class="rl-band" style="--n:${aa.player.length}">${aa.player}</div>
                 <div class="rl-ovsub">${[aa.team_name, min].filter(Boolean).join(' • ')}</div></div>`
            : `${card ? cardEl : logo}${title}<div class="rl-ovsub">${line}</div>`;
          overlay = `<div class="rl-ov${photo ? ' rl-hasph' : ''}${card ? ' rl-iscard' : ''}" data-k="${aa.started_at}"
            style="--c:${color};--fg:${fg};--age:${age}ms;animation-duration:${durMs}ms;animation-delay:-${age}ms">
            <video class="rl-vid" src="${media}" autoplay muted loop playsinline onerror="this.remove()"></video>
            ${back}${front}${confetti}${card ? WHISTLE : ''}</div>`;
        }
        return css + `<div class="rl-wrap${FORCE_MOTION ? '' : ' rl-calm'}">${wm}${ticker}<div class="rl-main">${main}</div>${overlay}</div>`;
        ]]]
