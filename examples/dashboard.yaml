# Rugby Live: example dashboard. Views: Rugby (Sections) and Direct (full-screen panel with event animations).
# Needs custom:button-card. Replace stade_toulousain with your favourite team prefix.
# Optional animation videos: /config/www/rugby_live/anim/<type>.mp4 and <type>_toulouse.mp4 (see docs/05-ANIMATIONS.md).
title: Rugby
views:
- title: Rugby
  path: rugby
  icon: mdi:rugby
  type: sections
  max_columns: 4
  sections:
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Stade Toulousain
      icon: mdi:rugby
    - type: custom:button-card
      entity: sensor.stade_toulousain_statut_du_match
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: none
      styles:
        card: &id001
        - padding: 12px
        - border-radius: 16px
        - background-color: '#1f2937'
        - border: '1px solid #374151'
        - color: '#fff'
        grid:
        - grid-template-areas: '"hero"'
      custom_fields:
        hero: |-
          [[[
          const st = entity.state;
          const sc = states['sensor.stade_toulousain_score'] || {attributes: {}};
          const mn = states['sensor.stade_toulousain_minute'];
          const nx = states['sensor.stade_toulousain_prochain_match'];
          const ev = states['sensor.stade_toulousain_dernier_evenement'];
          const L = {scheduled:'À venir',first_half:'1re mi-temps',half_time:'Mi-temps',second_half:'2e mi-temps',extra_time:'Prolongations',finished:'Terminé',postponed:'Reporté',cancelled:'Annulé',unknown:'—'};
          const logo = (url, name, color) => url
            ? `<img src="${url}" style="height:64px;width:64px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))">`
            : `<div style="height:64px;width:64px;border-radius:50%;background:${color || '#374151'};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff">${(name || '?').slice(0, 3).toUpperCase()}</div>`;
          const team = (url, name, color) => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:34%">${logo(url, name, color)}<span style="font-size:13px;font-weight:600;text-align:center">${name || ''}</span></div>`;
          if (st === 'no_match' || st === 'unavailable') {
            if (!nx || !nx.state || nx.state === 'unknown' || nx.state === 'unavailable') return '<div style="padding:16px;color:#9ca3af">Aucun match prévu</div>';
            const a = nx.attributes, d = new Date(nx.state);
            const when = d.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'}) + ' • ' + d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}).replace(':', 'h');
            const home = a.home_away === 'home';
            const h = home ? [a.team_logo, a.team_name, a.team_color] : [a.opponent_logo, a.opponent_name, a.opponent_color];
            const w = home ? [a.opponent_logo, a.opponent_name, a.opponent_color] : [a.team_logo, a.team_name, a.team_color];
            return `<div style="padding:4px 8px 12px">
              <div style="text-align:center;font-size:11px;letter-spacing:1px;color:#9ca3af;text-transform:uppercase">Prochain match • ${a.competition === 'top14' ? 'Top 14' : a.competition === 'champions_cup' ? 'Champions Cup' : 'Challenge Cup'}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">${team(...h)}<div style="font-size:22px;font-weight:800;color:#9ca3af">VS</div>${team(...w)}</div>
              <div style="text-align:center;margin-top:10px;font-size:13px;color:#4ade80;font-weight:600">${when}</div>
              <div style="text-align:center;font-size:11px;color:#9ca3af">${a.venue || ''}</div>${a.channel ? `<div style="text-align:center;font-size:12px;color:#4ade80;margin-top:4px">📺 ${a.channel}</div>` : ''}</div>`;
          }
          const a = sc.attributes;
          const live = ['first_half', 'half_time', 'second_half', 'extra_time'].includes(st);
          const minute = mn && mn.attributes.display ? mn.attributes.display : '';
          const badge = live
            ? `<span style="background:#dc2626;color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">● LIVE</span> <span style="font-weight:700">${minute}</span>`
            : `<span style="color:#9ca3af;font-size:12px;font-weight:600">${L[st] || st}</span>`;
          const score = st === 'scheduled' ? '<span style="color:#9ca3af">VS</span>' : `${a.home_score ?? 0} <span style="color:#6b7280">-</span> ${a.away_score ?? 0}`;
          const last = ev && ev.state && ev.state !== 'unknown' ? `<div style="text-align:center;margin-top:10px;font-size:12px;color:#d1d5db">${ev.state}</div>` : '';
          return `<div style="padding:4px 8px 12px">
            <div style="text-align:center">${badge}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
              ${team(a.home_logo, a.home_name, a.home_color)}
              <div style="font-size:34px;font-weight:800;white-space:nowrap">${score}</div>
              ${team(a.away_logo, a.away_name, a.away_color)}
            </div>${last}</div>`;
          ]]]
      grid_options:
        columns: 12
    - type: tile
      entity: binary_sensor.stade_toulousain_carton_jaune_en_cours
      name: Carton jaune en cours
      visibility:
      - condition: state
        entity: binary_sensor.stade_toulousain_carton_jaune_en_cours
        state: 'on'
      grid_options:
        columns: 12
    - type: markdown
      title: Fil du match
      content: |-
        {% set evs = state_attr('sensor.stade_toulousain_dernier_evenement', 'events') or [] %}
        {% set icons = {'try': '🏉', 'conversion': '🎯', 'penalty_goal': '🎯', 'drop_goal': '🎯', 'yellow_card': '🟨', 'red_card': '🟥'} %}
        {% set shown = evs | rejectattr('type', 'in', ['sub_on', 'sub_off']) | list %}
        {% if shown %}
        {% for e in shown | reverse %}
        {{ icons.get(e.type, '•') }} **{{ e.minute }}'** {{ e.label }} — {{ e.player or e.team }} <small>({{ e.team }})</small>
        {% endfor %}
        {% else %}
        _Aucun événement pour l'instant._
        {% endif %}
      visibility:
      - condition: state
        entity: sensor.stade_toulousain_statut_du_match
        state_not: no_match
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Match suivi
      icon: mdi:target-account
    - type: tile
      entity: select.rugby_live_match_suivi
      name: Choisir le match
      features:
      - type: select-options
      grid_options:
        columns: 12
    - type: custom:button-card
      entity: sensor.match_suivi_statut_du_match
      show_name: false
      show_icon: false
      show_state: false
      tap_action:
        action: none
      styles:
        card: *id001
        grid:
        - grid-template-areas: '"hero"'
      custom_fields:
        hero: |-
          [[[
          const st = entity.state;
          const sc = states['sensor.match_suivi_score'] || {attributes: {}};
          const mn = states['sensor.match_suivi_minute'];
          const nx = states['sensor.match_suivi_prochain_match'];
          const ev = states['sensor.match_suivi_dernier_evenement'];
          const L = {scheduled:'À venir',first_half:'1re mi-temps',half_time:'Mi-temps',second_half:'2e mi-temps',extra_time:'Prolongations',finished:'Terminé',postponed:'Reporté',cancelled:'Annulé',unknown:'—'};
          const logo = (url, name, color) => url
            ? `<img src="${url}" style="height:64px;width:64px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))">`
            : `<div style="height:64px;width:64px;border-radius:50%;background:${color || '#374151'};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#fff">${(name || '?').slice(0, 3).toUpperCase()}</div>`;
          const team = (url, name, color) => `<div style="display:flex;flex-direction:column;align-items:center;gap:6px;width:34%">${logo(url, name, color)}<span style="font-size:13px;font-weight:600;text-align:center">${name || ''}</span></div>`;
          if (st === 'no_match' || st === 'unavailable') {
            if (!nx || !nx.state || nx.state === 'unknown' || nx.state === 'unavailable') return '<div style="padding:16px;color:#9ca3af">Aucun match prévu</div>';
            const a = nx.attributes, d = new Date(nx.state);
            const when = d.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'}) + ' • ' + d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}).replace(':', 'h');
            const home = a.home_away === 'home';
            const h = home ? [a.team_logo, a.team_name, a.team_color] : [a.opponent_logo, a.opponent_name, a.opponent_color];
            const w = home ? [a.opponent_logo, a.opponent_name, a.opponent_color] : [a.team_logo, a.team_name, a.team_color];
            return `<div style="padding:4px 8px 12px">
              <div style="text-align:center;font-size:11px;letter-spacing:1px;color:#9ca3af;text-transform:uppercase">Prochain match • ${a.competition === 'top14' ? 'Top 14' : a.competition === 'champions_cup' ? 'Champions Cup' : 'Challenge Cup'}</div>
              <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">${team(...h)}<div style="font-size:22px;font-weight:800;color:#9ca3af">VS</div>${team(...w)}</div>
              <div style="text-align:center;margin-top:10px;font-size:13px;color:#4ade80;font-weight:600">${when}</div>
              <div style="text-align:center;font-size:11px;color:#9ca3af">${a.venue || ''}</div>${a.channel ? `<div style="text-align:center;font-size:12px;color:#4ade80;margin-top:4px">📺 ${a.channel}</div>` : ''}</div>`;
          }
          const a = sc.attributes;
          const live = ['first_half', 'half_time', 'second_half', 'extra_time'].includes(st);
          const minute = mn && mn.attributes.display ? mn.attributes.display : '';
          const badge = live
            ? `<span style="background:#dc2626;color:#fff;border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700">● LIVE</span> <span style="font-weight:700">${minute}</span>`
            : `<span style="color:#9ca3af;font-size:12px;font-weight:600">${L[st] || st}</span>`;
          const score = st === 'scheduled' ? '<span style="color:#9ca3af">VS</span>' : `${a.home_score ?? 0} <span style="color:#6b7280">-</span> ${a.away_score ?? 0}`;
          const last = ev && ev.state && ev.state !== 'unknown' ? `<div style="text-align:center;margin-top:10px;font-size:12px;color:#d1d5db">${ev.state}</div>` : '';
          return `<div style="padding:4px 8px 12px">
            <div style="text-align:center">${badge}</div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-top:10px">
              ${team(a.home_logo, a.home_name, a.home_color)}
              <div style="font-size:34px;font-weight:800;white-space:nowrap">${score}</div>
              ${team(a.away_logo, a.away_name, a.away_color)}
            </div>${last}</div>`;
          ]]]
      grid_options:
        columns: 12
    - type: tile
      entity: binary_sensor.match_suivi_carton_jaune_en_cours
      name: Carton jaune en cours
      visibility:
      - condition: state
        entity: binary_sensor.match_suivi_carton_jaune_en_cours
        state: 'on'
      grid_options:
        columns: 12
    - type: markdown
      title: Fil du match suivi
      content: |-
        {% set evs = state_attr('sensor.match_suivi_dernier_evenement', 'events') or [] %}
        {% set icons = {'try': '🏉', 'conversion': '🎯', 'penalty_goal': '🎯', 'drop_goal': '🎯', 'yellow_card': '🟨', 'red_card': '🟥'} %}
        {% set shown = evs | rejectattr('type', 'in', ['sub_on', 'sub_off']) | list %}
        {% if shown %}
        {% for e in shown | reverse %}
        {{ icons.get(e.type, '•') }} **{{ e.minute }}'** {{ e.label }} — {{ e.player or e.team }} <small>({{ e.team }})</small>
        {% endfor %}
        {% else %}
        _Aucun événement pour l'instant._
        {% endif %}
      visibility:
      - condition: state
        entity: sensor.match_suivi_statut_du_match
        state_not: no_match
      grid_options:
        columns: 12
    - type: tile
      entity: event.match_suivi_evenement_du_match
      name: Dernier signal (pour les animations)
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Tous les matchs
      icon: mdi:scoreboard
    - type: markdown
      content: |-
        {% set comps = [('sensor.top_14_matchs_en_direct', 'Top 14'), ('sensor.champions_cup_matchs_en_direct', 'Champions Cup'), ('sensor.challenge_cup_matchs_en_direct', 'Challenge Cup')] %}
        {% set labels = {'scheduled': '', 'first_half': '1re MT', 'half_time': 'MT', 'second_half': '2e MT', 'extra_time': 'Prol.', 'finished': 'Fin', 'postponed': 'Reporté', 'cancelled': 'Annulé', 'unknown': ''} %}
        {% set days = ['lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.', 'dim.'] %}
        {% for entity, title in comps %}
        {% set ms = state_attr(entity, 'matches') or [] %}
        {% if ms %}
        ### {{ title }}
        <table width="100%">
        {% for m in ms %}
        {% set k = as_local(as_datetime(m.kickoff)) %}
        {% set live = m.status in ['first_half', 'half_time', 'second_half', 'extra_time'] %}
        <tr>
        <td width="16%"><small>{% if m.status == 'scheduled' %}{{ days[k.weekday()] }} {{ k.strftime('%H:%M') }}{% elif live %}<font color="#ef4444"><b>{{ m.minute or labels[m.status] }}</b></font>{% else %}{{ labels[m.status] }}{% endif %}</small></td>
        <td align="right" width="32%">{{ m.home_name }} {% if m.home_logo %}<img src="{{ m.home_logo }}" width="20" height="20">{% endif %}</td>
        <td align="center" width="18%"><b>{% if m.status == 'scheduled' %}-{% else %}{{ m.home_score }} - {{ m.away_score }}{% endif %}</b></td>
        <td width="34%">{% if m.away_logo %}<img src="{{ m.away_logo }}" width="20" height="20">{% endif %} {{ m.away_name }}{% if m.channel %} <small>📺 {{ m.channel }}</small>{% endif %}</td>
        </tr>
        {% endfor %}
        </table>
        {% endif %}
        {% endfor %}
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Calendrier
      icon: mdi:calendar
    - type: calendar
      initial_view: listWeek
      entities:
      - calendar.top_14_matchs
      - calendar.champions_cup_matchs
      - calendar.challenge_cup_matchs
      - calendar.calendrier_allrugby_2
      grid_options:
        columns: 12
  - type: grid
    column_span: 2
    cards:
    - type: heading
      heading: Retard (anti-spoil)
      icon: mdi:timer-sand
    - type: tile
      entity: number.rugby_live_retard
      name: Retard
      features:
      - type: numeric-input
        style: buttons
      grid_options:
        columns: 12
    - type: button
      name: -5 s
      icon: mdi:timer-minus-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: rugby_live.set_delay
        data:
          seconds: -5
          relative: true
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: -1 s
      icon: mdi:timer-minus-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: rugby_live.set_delay
        data:
          seconds: -1
          relative: true
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: +1 s
      icon: mdi:timer-plus-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: rugby_live.set_delay
        data:
          seconds: 1
          relative: true
      grid_options:
        columns: 3
        rows: 1
    - type: button
      name: +5 s
      icon: mdi:timer-plus-outline
      show_state: false
      tap_action:
        action: perform-action
        perform_action: rugby_live.set_delay
        data:
          seconds: 5
          relative: true
      grid_options:
        columns: 3
        rows: 1
    - type: tile
      entity: button.rugby_live_calibrer_le_retard
      name: Calibrer (au moment où l'action passe à la TV)
      tap_action:
        action: perform-action
        perform_action: button.press
        target:
          entity_id: button.rugby_live_calibrer_le_retard
      grid_options:
        columns: 12
    - type: tile
      entity: sensor.rugby_live_etat_de_l_api
      name: Source ESPN
      grid_options:
        columns: 12
- title: Direct
  path: direct
  icon: mdi:television-classic
  type: panel
  cards:
  - type: custom:button-card
    entity: event.match_suivi_evenement_du_match
    show_name: false
    show_icon: false
    show_state: false
    tap_action:
      action: none
    triggers_update:
    - sensor.match_suivi_statut_du_match
    - sensor.match_suivi_score
    - sensor.match_suivi_minute
    - sensor.match_suivi_dernier_evenement
    - sensor.top_14_matchs_en_direct
    - sensor.champions_cup_matchs_en_direct
    - sensor.challenge_cup_matchs_en_direct
    - sensor.stade_toulousain_prochain_match
    styles:
      card:
      - padding: '0'
      - border-radius: '0'
      - background: '#020617'
      grid:
      - grid-template-areas: '"direct"'
      custom_fields:
        direct:
        - width: 100%
    custom_fields:
      direct: |-
        [[[
        const css = "<style>\n.rl-wrap{position:relative;height:calc(100vh - var(--header-height, 56px));min-height:420px;overflow:hidden;\n  background:radial-gradient(circle at 50% 30%,#1e293b,#020617);color:#fff;display:flex;flex-direction:column}\n.rl-tick{height:5vh;min-height:34px;background:#0b1220;border-bottom:3px solid #dc2626;overflow:hidden;\n  white-space:nowrap;display:flex;align-items:center;font-size:2.4vh}\n.rl-tick-in{display:inline-block;padding-left:100%;animation:rl-marq linear infinite}\n@keyframes rl-marq{from{transform:translateX(0)}to{transform:translateX(-100%)}}\n.rl-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5vh}\n.rl-comp{font-size:2.4vh;letter-spacing:.4em;color:#94a3b8}\n.rl-row{display:flex;align-items:center;justify-content:center;gap:4vw;width:100%}\n.rl-team{display:flex;flex-direction:column;align-items:center;gap:1.5vh;width:28vw}\n.rl-logo{height:24vh;width:24vh;object-fit:contain;filter:drop-shadow(0 6px 18px rgba(0,0,0,.7))}\n.rl-init{height:24vh;width:24vh;border-radius:50%;display:flex;align-items:center;justify-content:center;\n  font-size:8vh;font-weight:900}\n.rl-name{font-size:4vh;font-weight:800;text-align:center;text-transform:uppercase}\n.rl-score{font-size:18vh;font-weight:900;font-variant-numeric:tabular-nums;line-height:1;white-space:nowrap}\n.rl-state{font-size:3.2vh;font-weight:700}\n.rl-live{background:#dc2626;border-radius:999px;padding:.4vh 1.6vh;margin-right:1.2vh;animation:rl-pulse 1.4s infinite}\n@keyframes rl-pulse{50%{opacity:.45}}\n.rl-last{font-size:3vh;color:#cbd5e1}\n.rl-chan{font-size:2.4vh;color:#4ade80;font-weight:700}\n.rl-wm{position:absolute;inset:0;margin:auto;height:72vh;max-width:80vw;object-fit:contain;opacity:.06;filter:grayscale(1) brightness(2);pointer-events:none;z-index:0}\n.rl-tick,.rl-main{position:relative;z-index:1}\n.rl-prov{color:#fde68a}\n.rl-provtag{font-size:1.8vh;color:#fbbf24;letter-spacing:.2em}\n.rl-next{margin-top:2vh;padding:1.6vh 3vh;border:1px solid #334155;border-radius:2vh;background:rgba(15,23,42,.7);text-align:center;font-size:2.8vh}\n.rl-next b{color:#fff}.rl-next small{display:block;color:#94a3b8;letter-spacing:.3em;font-size:1.8vh}\n.rl-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;\n  overflow:hidden;background:radial-gradient(circle,var(--c) 0%,rgba(0,0,0,.94) 72%);\n  animation:rl-ov 8s ease forwards;z-index:5}\n@keyframes rl-ov{0%{opacity:0;transform:scale(1.3)}6%{opacity:1;transform:scale(1)}85%{opacity:1}\n  100%{opacity:0;visibility:hidden}}\n.rl-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}\n.rl-burst{position:absolute;width:160vmax;height:160vmax;\n  background:repeating-conic-gradient(rgba(255,255,255,.13) 0deg 8deg,transparent 8deg 22deg);animation:rl-spin 8s linear}\n@keyframes rl-spin{to{transform:rotate(200deg)}}\n.rl-ovlogo{position:relative;height:26vh;animation:rl-pop 1s ease both}\n@keyframes rl-pop{0%{transform:scale(0) rotate(-200deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}\n.rl-ovtxt{position:relative;font-size:17vh;font-weight:900;letter-spacing:.04em;text-align:center;\n  text-shadow:0 0 40px var(--c),0 8px 0 #000;animation:rl-shake .45s ease 4}\n@keyframes rl-shake{25%{transform:rotate(-3deg) scale(1.08)}75%{transform:rotate(3deg) scale(1.08)}}\n.rl-ovsub{position:relative;font-size:4.5vh;font-weight:800;margin-top:2vh;text-shadow:0 3px 0 #000}\n@media (prefers-reduced-motion:reduce){.rl-burst,.rl-ovtxt,.rl-ovlogo,.rl-tick-in,.rl-live{animation:none}}\n</style>";

        const F = 'sensor.match_suivi';
        const st = states[F + '_statut_du_match'];
        const s = st ? st.state : 'no_match';
        const sa = st ? st.attributes : {};
        const a = (states[F + '_score'] || {attributes: {}}).attributes || {};
        const mn = states[F + '_minute'];
        const le = states[F + '_dernier_evenement'];
        const COMP = {top14: 'TOP 14', champions_cup: 'CHAMPIONS CUP', challenge_cup: 'CHALLENGE CUP'};
        const WM = {top14: 'Top 14', champions_cup: 'Champions Cup', challenge_cup: 'Challenge Cup'}[sa.competition];
        const wm = WM ? `<img class="rl-wm" src="/local/images/rugby/competitions/${encodeURIComponent(WM)}.svg" onerror="this.remove()">` : '';
        const L = {scheduled: 'À venir', first_half: '1re mi-temps', half_time: 'Mi-temps', second_half: '2e mi-temps',
          extra_time: 'Prolongations', finished: 'Terminé', postponed: 'Reporté', cancelled: 'Annulé', unknown: ''};
        const LIVE = ['first_half', 'half_time', 'second_half', 'extra_time'];
        const big = (url, name, color) => url ? `<img class="rl-logo" src="${url}">`
          : `<div class="rl-init" style="background:${color || '#334155'}">${(name || '?').slice(0, 3).toUpperCase()}</div>`;
        const hhmm = (d) => d.toLocaleTimeString('fr-FR', {hour: '2-digit', minute: '2-digit'}).replace(':', 'h');

        const tick = [];
        const DAYS = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
        let pool = sa.matchday;
        if (!pool) { pool = []; for (const id of ['sensor.top_14_matchs_en_direct', 'sensor.champions_cup_matchs_en_direct', 'sensor.challenge_cup_matchs_en_direct']) { const m = states[id]; pool.push(...((m && m.attributes.matches) || [])); } }
        {
          for (const x of pool) {
            const k = new Date(x.kickoff);
            if (x.status === 'scheduled') tick.push(`${x.home_name} – ${x.away_name} <b>${DAYS[k.getDay()]} ${hhmm(k)}</b>`);
            else tick.push(`${x.home_name} <b>${x.home_score} - ${x.away_score}</b> ${x.away_name} <span style="color:#f87171">${LIVE.includes(x.status) ? (x.minute || '') : 'Fin'}</span>`);
          }
        }
        const dur = Math.max(25, tick.length * 7);
        const line = tick.join(' &nbsp;&nbsp;•&nbsp;&nbsp; ');
        const ticker = tick.length ? `<div class="rl-tick"><div class="rl-tick-in" style="animation-duration:${dur}s;animation-delay:-${((Date.now() / 1000) % dur).toFixed(1)}s">${line} &nbsp;&nbsp;•&nbsp;&nbsp; ${line}</div></div>` : '';

        let main;
        if (s === 'no_match') {
          main = '<div class="rl-state" style="color:#94a3b8">Aucun match pour le moment</div>';
        } else {
          const live = LIVE.includes(s);
          const minute = mn && mn.attributes.display ? mn.attributes.display : '';
          const state = live ? `<span class="rl-live">LIVE</span>${minute}` : (s === 'scheduled' ? `Coup d'envoi ${hhmm(new Date(sa.kickoff))}` : L[s] || s);
          const prov = a.provisional ? ' rl-prov' : '';
          const score = s === 'scheduled' ? '<span style="color:#64748b">VS</span>' : `<span class="${prov}">${a.home_score ?? 0}</span><span style="color:#475569"> - </span><span class="${prov}">${a.away_score ?? 0}</span>`;
          const nowMin = mn && !isNaN(parseInt(mn.state)) ? parseInt(mn.state) : null;
          const evMin = le && le.attributes ? le.attributes.minute : null;
          const fresh = live && nowMin !== null && evMin != null && nowMin - evMin <= 3;
          const last = fresh && le.state && le.state !== 'unknown' ? `<div class="rl-last">${le.state}</div>` : '';
          const provtag = a.provisional ? '<div class="rl-provtag">SCORE EN ATTENTE DE VALIDATION</div>' : '';
          let next = '';
          if (s === 'finished') {
            const nx = states['sensor.stade_toulousain_prochain_match'];
            if (nx && nx.state && !['unknown', 'unavailable'].includes(nx.state)) {
              const n = nx.attributes, d = new Date(nx.state);
              const when = d.toLocaleDateString('fr-FR', {weekday: 'long', day: 'numeric', month: 'long'}) + ' • ' + hhmm(d);
              const vs = n.home_away === 'home' ? `${n.team_name} – ${n.opponent_name}` : `${n.opponent_name} – ${n.team_name}`;
              next = `<div class="rl-next"><small>PROCHAIN MATCH • ${COMP[n.competition] || ''}</small><b>${vs}</b><br>${when}${n.channel ? ' • 📺 ' + n.channel : ''}</div>`;
            }
          }
          main = `<div class="rl-comp">${COMP[sa.competition] || ''}</div>
            <div class="rl-row">
              <div class="rl-team">${big(a.home_logo, a.home_name, a.home_color)}<div class="rl-name">${a.home_name || ''}</div></div>
              <div class="rl-score">${score}</div>
              <div class="rl-team">${big(a.away_logo, a.away_name, a.away_color)}<div class="rl-name">${a.away_name || ''}</div></div>
            </div>
            ${provtag}<div class="rl-state">${state}</div>${last}
            ${sa.channel && s !== 'finished' ? `<div class="rl-chan">📺 ${sa.channel}</div>` : ''}${next}`;
        }

        let overlay = '';
        const ev = entity;
        const ts = ev && ev.state ? Date.parse(ev.state) : NaN;
        const age = Date.now() - ts;
        if (!isNaN(ts) && age >= 0 && age < 8000) {
          const t = ev.attributes.event_type;
          const TXT = {try: 'ESSAI !', conversion: 'TRANSFORMATION', penalty_goal: 'PÉNALITÉ', drop_goal: 'DROP !',
            yellow_card: 'CARTON JAUNE', red_card: 'CARTON ROUGE', kickoff: "COUP D'ENVOI", half_time: 'MI-TEMPS',
            second_half: 'REPRISE', extra_time: 'PROLONGATIONS', full_time: 'FIN DU MATCH', revoked: 'ACTION ANNULÉE',
            substitution: 'REMPLACEMENT'};
          const tid = ev.attributes.team_id;
          const home = tid && tid === a.home_id;
          const tcolor = home ? a.home_color : (tid ? a.away_color : null);
          const color = t === 'yellow_card' ? '#eab308' : t === 'red_card' ? '#dc2626' : (tcolor || '#334155');
          const tlogo = home ? a.home_logo : (tid ? a.away_logo : null);
          const special = tid === '25922' && ['try', 'conversion', 'penalty_goal', 'drop_goal'].includes(t);
          const media = `/local/rugby_live/anim/${special ? t + '_toulouse' : t}.mp4#t=${(age / 1000).toFixed(1)}`;
          const d = `animation-delay:-${age}ms`;
          const who = [ev.attributes.player || ev.attributes.team_name, ev.attributes.minute ? ev.attributes.minute + "'" : ''].filter(Boolean).join(' • ');
          overlay = `<div class="rl-ov" data-k="${ev.state}" style="--c:${color};${d}">
            <video class="rl-vid" src="${media}" autoplay muted playsinline onerror="this.remove()"></video>
            <div class="rl-burst" style="${d}"></div>
            ${tlogo ? `<img class="rl-ovlogo" src="${tlogo}" style="${d}">` : ''}
            <div class="rl-ovtxt" style="${d}">${TXT[t] || t}</div>
            <div class="rl-ovsub">${who}</div></div>`;
        }
        return css + `<div class="rl-wrap">${wm}${ticker}<div class="rl-main">${main}</div>${overlay}</div>`;
        ]]]
