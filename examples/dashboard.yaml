        {% for e in shown | reverse %}
        {{ icons.get(e.type, '•') }} **{{ e.minute }}'** {{ e.label }} — {{ e.player or e.team }} <small>({{ e.team }})</small>
        {% endfor %}
        {% else %}
        _Aucun événement pour l'instant._
